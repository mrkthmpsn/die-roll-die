[project]
name = "die-scouting"
version = "0.0.1"
description = "Bayesian quality distributions turned into weighted dice, illustrating uncertainty in per-entity estimates."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mark Thompson" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2",
]

[dependency-groups]
scrape = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]
dev = [
    "pytest>=8",
    { include-group = "scrape" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["die_scouting"]
