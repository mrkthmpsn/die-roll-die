[project]
name = "die-roll-die"
dynamic = ["version"]
description = "Bayesian quality distributions turned into weighted dice, illustrating uncertainty in per-entity estimates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mark Thompson" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2",
]

[dependency-groups]
scrape = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]
dev = [
    "pytest>=8",
    { include-group = "scrape" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "die_scouting/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["die_scouting"]
