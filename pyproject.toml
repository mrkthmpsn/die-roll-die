[project]
name = "die-scouting"
version = "0.0.1"
description = "Bayesian quality distributions turned into weighted dice, illustrating uncertainty in per-entity estimates."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mark Thompson" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["die_scouting"]
