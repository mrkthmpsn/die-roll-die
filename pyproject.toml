[project]
name = "die-roll-die"
dynamic = ["version"]
description = "Bayesian quality distributions turned into weighted dice, illustrating uncertainty in per-entity estimates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Mark Thompson" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mrkthmpsn/die-roll-die"
Repository = "https://github.com/mrkthmpsn/die-roll-die"
Issues = "https://github.com/mrkthmpsn/die-roll-die/issues"

[dependency-groups]
scrape = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]
dev = [
    "pytest>=8",
    { include-group = "scrape" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "die_roll_die/__init__.py"

[tool.hatch.build.targets.sdist]
# data/ is CC BY-SA rather than MIT, so it stays in the repository and out of the
# published distribution; see NOTICE.
exclude = ["/data"]

[tool.hatch.build.targets.wheel]
packages = ["die_roll_die"]
